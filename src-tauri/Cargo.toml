[package]
name = "tinixcut"
version = "0.1.0"
description = "TinixCut — Automation-First Desktop Video Editor"
authors = ["Tinix Team"]
edition = "2021"

[lib]
name = "tinixcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
mock-ipc-tests = ["tauri/test"]

[dependencies]
tokio-util = "0.7"
schemars = "1.2.2"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }
sha2 = "0.11.0"
flate2 = "1"
base64 = "0.23.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
reqwest = { version = "0.13", features = ["json"] }
unicode-segmentation = "1.13.3"
ab_glyph = "0.2.32"
unicode-normalization = "0.1.26"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
